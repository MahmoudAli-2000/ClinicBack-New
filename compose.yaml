# Keep ClinicBack-New and Clinic-Front-New side by side.
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${CLINIC_DB_PASSWORD:?Set CLINIC_DB_PASSWORD in .env}
    ports: ["1433:1433"]
    volumes: ["clinic-data:/var/opt/mssql"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
  api:
    build: .
    depends_on:
      db: {condition: service_healthy}
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Server=db;Database=ClinicDb;User Id=sa;Password=${CLINIC_DB_PASSWORD};TrustServerCertificate=True
      JwtSettings__Key: ${CLINIC_JWT_KEY:?Set CLINIC_JWT_KEY in .env}
      Seed__AdminPassword: ${CLINIC_ADMIN_PASSWORD:?Set CLINIC_ADMIN_PASSWORD in .env}
      FrontendUrl: http://localhost:4200
    ports: ["5295:8080"]
  web:
    build: ../Clinic-Front-New
    depends_on: [api]
    ports: ["4200:80"]
volumes:
  clinic-data:
